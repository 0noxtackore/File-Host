name: Keep Supabase Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: curl -s https://f-h.netlify.app/ > /dev/null
      - name: Query Supabase
        run: |
          curl -s 'https://qxgmhfugoxzzqblztuvq.supabase.co/rest/v1/files?select=id&limit=1' \
            -H 'apikey: sb_publishable_zs0n2Xm3WrWg2YcE7SulmA_VMPU7WVT' \
            -H 'Authorization: Bearer sb_publishable_zs0n2Xm3WrWg2YcE7SulmA_VMPU7WVT'
